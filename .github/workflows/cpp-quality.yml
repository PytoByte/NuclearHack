name: C++ Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install static analysis tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy clang-tools cppcheck

      - name: Bootstrap native audio dependencies
        run: make audio-bootstrap

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Check formatting and secrets
        run: pre-commit run --all-files

      - name: Configure C++ build
        working-directory: src/audio
        run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        working-directory: src/audio
        run: run-clang-tidy -p build

      - name: Run cppcheck
        run: bash scripts/cppcheck.sh